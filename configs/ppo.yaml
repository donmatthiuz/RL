# PPO (AGT-04). Hiperparámetros iniciales; se ajustan en val con AGT-09.
# Validar con: make config CONFIG=configs/ppo.yaml
# env y reward tienen que ser iguales a configs/env.yaml (lo comprueba un test): los baselines y
# los agentes se evalúan con el mismo simulador.
dataset_id: btc_updown_1h_v1
env:
  initial_cash: 1000.0
  stake_fraction: 0.02      # 20 USDC por orden (S4b)
  latency_s: 2              # S4a, provisional hasta validar con trades (EVA-11)
  tolerance_s: 60           # S4a; no puede superar el paso de la grilla
  no_open_last_minutes: 2   # S10
  normalize: true           # z-score de normalization.json, ajustado con train
  costs:                    # S5 y ADR-009, los mismos valores que configs/costs.yaml
    half_spread: 0.01       # sensibilidad con 0.02
    fee_rate: 0.07          # 0.0 para la ablación sin comisión
    fee_exponent: 1
    fee_decimals: 5
    min_fee: 0.00001
    tick: 0.001
reward:
  name: pnl_risk            # ganadora de la ablación de ENV-08 en val (02/11/2026, reports/val)
  base: pnl_mid
  lambda_dd: 1.0
  lambda_invalid: 0.0       # S6
agent:
  algo: ppo
  policy: MlpPolicy
  net_arch: [64, 64]
  learning_rate: 3.0e-4
  gamma: 0.999              # S9: cerca de 1, un resultado 60 pasos después pesa 0,94
  total_timesteps: 500000   # unas 8 400 velas de train: recorre train una vez (docs/08)
  n_envs: 4
  checkpoints: 10           # protocolo de EVA-01, sección 5
  params:
    n_steps: 512            # 512 × 4 entornos = 2 048 pasos por rollout
    batch_size: 256
    ent_coef: 0.01
seeds: [0, 1, 2, 3, 4]
eval_split: val             # se abre después de aprobar el protocolo de EVA-01 (#8)
