# Simulador: reglas del entorno y recompensa (docs/09, ADR-013, ADR-016 y ADR-017).
# Validar con: make config CONFIG=configs/env.yaml
dataset_id: btc_updown_1h_v1
env:
  initial_cash: 1000.0
  stake_fraction: 0.02      # 20 USDC por orden (S4b)
  latency_s: 2              # S4a, provisional hasta validar con trades (EVA-11)
  tolerance_s: 60           # S4a; no puede superar el paso de la grilla
  no_open_last_minutes: 2   # S10
  normalize: true           # z-score de normalization.json, ajustado con train
  costs:                    # S5 y ADR-009, los mismos valores que configs/costs.yaml
    half_spread: 0.01       # sensibilidad con 0.02
    fee_rate: 0.07          # 0.0 para la ablación sin comisión
    fee_exponent: 1
    fee_decimals: 5
    min_fee: 0.00001
    tick: 0.001
reward:
  name: pnl                 # pnl, pnl_risk o terminal (ENV-05)
  lambda_dd: 0.0            # solo con pnl_risk
  lambda_invalid: 0.0       # S6
