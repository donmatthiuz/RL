<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">Cuatro agentes agrupados por forma de aprendizaje</title>
  <desc id="desc">PPO y DQN interactúan con el simulador; CQL aprende de transiciones fijas; BC imita acciones. Los cuatro pasan por la misma evaluación frente a NoTrade.</desc>
  <rect width="1280" height="430" fill="#F7F8FA"/>
  <g font-family="Inter,Arial,sans-serif" fill="#0B1220">
    <text x="72" y="53" font-size="22" font-weight="700">Tres familias, una evaluación compartida</text>
    <g stroke="#D7DEE8" stroke-width="2" fill="#FFFFFF">
      <rect x="72" y="92" width="350" height="210" rx="14"/>
      <rect x="465" y="92" width="350" height="210" rx="14"/>
      <rect x="858" y="92" width="350" height="210" rx="14"/>
    </g>
    <text x="100" y="133" font-size="16" font-weight="700" fill="#1D4ED8">RL EN LÍNEA</text>
    <text x="100" y="188" font-size="36" font-weight="700">PPO · DQN</text>
    <text x="100" y="230" font-size="19">Interactúan con el simulador</text>
    <text x="493" y="133" font-size="16" font-weight="700" fill="#0891B2">RL FUERA DE LÍNEA</text>
    <text x="493" y="188" font-size="36" font-weight="700">CQL</text>
    <text x="493" y="230" font-size="19">Aprende de transiciones fijas</text>
    <text x="886" y="133" font-size="16" font-weight="700" fill="#C2410C">IMITACIÓN</text>
    <text x="886" y="188" font-size="36" font-weight="700">BC</text>
    <text x="886" y="230" font-size="19">Copia acciones observadas</text>
    <path d="M247 303 V330 H1033 V303" fill="none" stroke="#64748B" stroke-width="3"/>
    <path d="M640 330 V352" stroke="#64748B" stroke-width="3"/>
    <rect x="418" y="352" width="444" height="52" rx="12" fill="#EDF1F7" stroke="#D7DEE8"/>
    <text x="640" y="386" text-anchor="middle" font-size="20" font-weight="700">Mismos costos y test · NoTrade = 0</text>
  </g>
</svg>
