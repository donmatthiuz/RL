<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 150" role="img" aria-labelledby="title desc">
  <title id="title">Cadena de verificación del proyecto</title>
  <desc id="desc">Validar datos, simular decisiones, entrenar agentes, comprobar resultados y mostrar la evidencia.</desc>
  <rect width="1100" height="150" rx="10" fill="#071b23"/>
  <g font-family="DejaVu Sans Mono, monospace" text-anchor="middle">
    <g fill="#0b2c35" stroke="#367784" stroke-width="2">
      <rect x="12" y="19" width="198" height="111" rx="8"/>
      <rect x="232" y="19" width="198" height="111" rx="8"/>
      <rect x="452" y="19" width="198" height="111" rx="8"/>
      <rect x="672" y="19" width="198" height="111" rx="8"/>
      <rect x="892" y="19" width="196" height="111" rx="8"/>
    </g>
    <g font-size="20" font-weight="bold" fill="#3bdcae">
      <text x="111" y="67">VALIDAR</text><text x="331" y="67">SIMULAR</text>
      <text x="551" y="67">ENTRENAR</text><text x="771" y="67">COMPROBAR</text><text x="990" y="67">MOSTRAR</text>
    </g>
