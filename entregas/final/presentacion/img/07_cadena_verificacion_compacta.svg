    </g>
  </g>
  <g fill="none" stroke="#67ddef" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M212 75 H228 M223 70 L228 75 L223 80"/>
    <path d="M432 75 H448 M443 70 L448 75 L443 80"/>
    <path d="M652 75 H668 M663 70 L668 75 L663 80"/>
    <path d="M872 75 H888 M883 70 L888 75 L883 80"/>
