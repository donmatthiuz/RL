<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 400" role="img" aria-labelledby="title desc">
  <title id="title">Bucle compacto de decisión</title>
  <desc id="desc">Observar precio, tiempo y cartera; decidir entre esperar, comprar YES, comprar NO y vender; actualizar posición, saldo y costos.</desc>
  <rect width="430" height="400" rx="12" fill="#071b23"/>
  <g fill="#0a2730" stroke="#2e6068" stroke-width="2">
    <rect x="24" y="26" width="382" height="99" rx="10"/>
    <rect x="24" y="155" width="382" height="114" rx="10"/>
    <rect x="24" y="299" width="382" height="86" rx="10"/>
  </g>
  <g font-family="DejaVu Sans Mono, monospace">
    <text x="48" y="57" fill="#67ddef" font-size="17">01 / OBSERVAR</text>
    <text x="48" y="97" fill="#e9fbf8" font-size="20">precio · tiempo · cartera</text>
    <text x="48" y="186" fill="#ffc66b" font-size="17">02 / DECIDIR</text>
    <g font-size="14" text-anchor="middle">
      <rect x="47" y="208" width="65" height="34" rx="5" fill="#155343" stroke="#3bdcae"/>
      <text x="79" y="231" fill="#e9fbf8">WAIT</text>
      <rect x="122" y="208" width="84" height="34" rx="5" fill="#0b333c" stroke="#397a84"/>
      <text x="164" y="231" fill="#e9fbf8">BUY_YES</text>
      <rect x="216" y="208" width="75" height="34" rx="5" fill="#0b333c" stroke="#397a84"/>
      <text x="254" y="231" fill="#e9fbf8">BUY_NO</text>
      <rect x="301" y="208" width="82" height="34" rx="5" fill="#0b333c" stroke="#397a84"/>
      <text x="342" y="231" fill="#e9fbf8">SELL</text>
    </g>
    <text x="48" y="331" fill="#3bdcae" font-size="17">03 / ACTUALIZAR</text>
    <text x="48" y="365" fill="#e9fbf8" font-size="20">posición · saldo · costos</text>
  </g>
  <g fill="none" stroke="#67ddef" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M215 126 V149 M209 143 L215 149 L221 143"/>
    <path d="M215 270 V293 M209 287 L215 293 L221 287"/>
  </g>
</svg>
