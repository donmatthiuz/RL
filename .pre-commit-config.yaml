# Hooks locales: cada integrante ejecuta `uv run pre-commit install` una vez.
# Las skills y agentes de terceros se versionan tal cual.
exclude: ^(\.skills|\.agents)/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1024] # evita subir datasets o modelos al repo
      - id: check-yaml
