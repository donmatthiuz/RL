[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polym4v"
version = "0.1.0"
description = "PolyRL: aprendizaje por refuerzo sobre mercados históricos de Polymarket"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "d3rlpy==2.8.1",
    "gymnasium==1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2",
    "pandas>=3.1",
    "pandera>=0.35",
    "polymarket-client==0.14.0",
    "pyarrow>=26",
    "pydantic>=2.13",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6",
    "stable-baselines3==2.9.2",
    "tensorboard>=2.18",
    "torch>=2.15.0",
]

[project.scripts]
polym4v = "polym4v.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["polym4v*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow and not network'"
markers = [
    "integration: varios módulos sobre el mini-dataset",
    "smoke: entrenamiento muy corto para detectar errores de integración",
    "slow: tarda más de 10 s",
    "network: usa la red real (APIs de Polymarket y Binance)",
]

[tool.coverage.run]
source = ["polym4v"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100
# Skills y agentes de terceros: se versionan tal cual.
extend-exclude = [".skills", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[dependency-groups]
demo = [
    "streamlit>=1.66.1",
]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=8,<10",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

# `uv sync` instala también la demo (EVA-07), para que la CI corra sus tests; no es una dependencia
# del paquete.
[tool.uv]
default-groups = ["dev", "demo"]

# torch solo para CPU en todas las plataformas: PPO y DQN con redes MLP corren mejor en CPU
# (documentación de stable-baselines3) y así la CI y cada integrante instalan lo mismo.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
