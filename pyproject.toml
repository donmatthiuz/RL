[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polym4v"
version = "0.1.0"
description = "PolyRL: aprendizaje por refuerzo sobre mercados históricos de Polymarket"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polymarket-client==0.14.0",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
polym4v = "polym4v.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["polym4v*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
