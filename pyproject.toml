[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-polymarket"
version = "0.1.0"
description = "Integración de Polymarket para el proyecto RL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polymarket-client==0.14.0",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
rl-polymarket = "rl_polymarket.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rl_polymarket*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
